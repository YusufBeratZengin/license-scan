[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "license-scan"
version = "0.1.0"
description = "Offline dependency license inventory and compliance scanner for Node and Python projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Yusuf Berat Zengin", email = "118852217+YusufBeratZengin@users.noreply.github.com" },
]
keywords = [
    "license",
    "compliance",
    "spdx",
    "security",
    "dependencies",
    "python",
    "node",
    "npm",
    "offline",
    "ci",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
license-scan = "license_scan.cli:main"

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/license-scan"
Repository = "https://github.com/YusufBeratZengin/license-scan.git"
Issues = "https://github.com/YusufBeratZengin/license-scan/issues"
Changelog = "https://github.com/YusufBeratZengin/license-scan/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["license_scan"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
